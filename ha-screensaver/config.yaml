name: Home Assistant Screensaver
version: "2.3.0"
slug: ha-screensaver
description: Photo slideshow screensaver for Home Assistant with idle detection
arch:
  - aarch64
  - amd64
  - armv7
init: false
homeassistant_api: true
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Web interface
ingress: true
ingress_port: 8080
panel_icon: mdi:camera-timer
map:
  - media:rw
  - share:rw
options:
  idle_timeout_seconds: 60
  slide_interval_seconds: 5
  photos_source: "media"
  clock_position: "bottom-center"
  weather_entity: ""
  media_player_entity: ""
  media_player_sources: ""
  night_mode_enabled: true
  night_mode_start: "21:00"
  night_mode_end: "05:00"
  night_mode_brightness: 15
schema:
  idle_timeout_seconds: int(1,3600)
  slide_interval_seconds: int(1,60)
  photos_source: list(media|share|addon)?
  clock_position: list(bottom-center|top-center|top-left|top-right|bottom-left|bottom-right)?
  weather_entity: str?
  media_player_entity: str?
  media_player_sources: str?
  night_mode_enabled: bool?
  night_mode_start: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)?
  night_mode_end: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)?
  night_mode_brightness: int(1,100)?
